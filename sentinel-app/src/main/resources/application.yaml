spring:
  data:
    mongodb:
      database: "sentinel"
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./sentinel-semi-persistent
    username: sa
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
logging:
  file:
    name: "app.log"
  level:
    root: debug
    com: debug
